<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简七读财 · 文章索引</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#fafbfc; --line:#e6e9ee;
  --text:#16202c; --text-2:#5e6e7d; --text-3:#98a2af;
  --brand:#ff6c00; --brand-soft:#fff2e8; --shadow:0 1px 3px rgba(20,32,48,.05),0 8px 24px rgba(20,32,48,.04);
  --radius:12px;
}
html[data-theme="dark"]{
  --bg:#14181e; --surface:#1d232b; --surface-2:#222932; --line:#303944;
  --text:#e8edf3; --text-2:#9aa8b8; --text-3:#6f7d8d;
  --brand:#ff8c3a; --brand-soft:#3a2a1c; --shadow:0 1px 3px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topbar__in{max-width:1440px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:210px}
.brand__mark{
  width:38px;height:38px;border-radius:11px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;letter-spacing:-1px;
  box-shadow:0 4px 12px rgba(255,108,0,.25);
}
.brand__t{font-size:17px;font-weight:700;letter-spacing:.2px;line-height:1.25}
.brand__s{font-size:11.5px;color:var(--text-3);letter-spacing:.4px}
.search{position:relative;flex:1;min-width:230px;max-width:520px}
.search input{
  width:100%;height:40px;padding:0 38px 0 38px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface-2);outline:none;transition:.18s;
}
.search input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft)}
.search__ic{position:absolute;left:13px;top:10px;color:var(--text-3);font-size:15px}
.search__kbd{position:absolute;right:11px;top:9px;color:var(--text-3);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface)}
.topbar__stats{display:flex;gap:18px;align-items:center;color:var(--text-2);font-size:12.5px;white-space:nowrap}
.topbar__stats b{color:var(--text);font-size:16px;font-weight:700}
.iconbtn{
  height:36px;padding:0 13px;border:1px solid var(--line);background:var(--surface);
  border-radius:9px;font-size:12.5px;color:var(--text-2);transition:.16s;white-space:nowrap;
}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}
.iconbtn--primary{background:var(--brand);border-color:var(--brand);color:#fff}
.iconbtn--primary:hover{filter:brightness(1.06);color:#fff}

/* ---------- layout ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:26px 28px 60px;display:grid;grid-template-columns:238px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:86px;max-height:calc(100vh - 108px);overflow-y:auto;padding-right:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel__h{font-size:11.5px;letter-spacing:1.2px;color:var(--text-3);font-weight:700;margin:0 0 12px;text-transform:uppercase}
.catlist{display:flex;flex-direction:column;gap:2px}
.cat{
  display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;
  font-size:13px;color:var(--text-2);cursor:pointer;transition:.14s;border:1px solid transparent;
}
.cat:hover{background:var(--surface-2);color:var(--text)}
.cat.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.cat__dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat__ic{width:16px;text-align:center;font-size:13px;opacity:.8;flex-shrink:0}
.cat__n{margin-left:auto;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.cat.on .cat__n{color:var(--brand)}
.years{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);background:var(--surface-2);border-radius:7px;
  padding:4px 9px;font-size:12px;color:var(--text-2);transition:.14s;
}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.quick{display:flex;flex-direction:column;gap:2px}
.quick button{
  text-align:left;background:transparent;border:0;padding:8px 9px;border-radius:8px;
  color:var(--text-2);font-size:13px;transition:.14s;
}
.quick button:hover{background:var(--surface-2);color:var(--text)}
.quick button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.note{font-size:11.5px;line-height:1.75;color:var(--text-3)}
.note b{color:var(--text-2)}
.note a{color:var(--brand)}

/* ---------- overview ---------- */
.hero{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);
}
.hero__top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start}
.hero h1{margin:0 0 6px;font-size:20px;letter-spacing:.2px}
.hero p{margin:0;color:var(--text-2);font-size:13px;max-width:640px;line-height:1.8}
.hero__badge{display:inline-block;background:var(--brand-soft);color:var(--brand);font-size:11px;padding:3px 9px;border-radius:20px;margin-bottom:9px;font-weight:600}
.chart{display:flex;align-items:flex-end;gap:8px;height:76px;margin-top:20px;border-bottom:1px solid var(--line);padding-bottom:0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;min-width:0}
.bar__col{width:100%;max-width:46px;background:var(--brand);opacity:.28;border-radius:5px 5px 0 0;transition:.18s;min-height:3px}
.bar:hover .bar__col{opacity:.62}
.bar.on .bar__col{opacity:1}
.bar__lb{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.bar.on .bar__lb{color:var(--brand);font-weight:700}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.toolbar__t{font-size:16px;font-weight:700;margin-right:auto}
.toolbar__t span{font-size:12px;color:var(--text-3);font-weight:400;margin-left:8px}
select{
  height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:0 10px;font-size:12.5px;outline:none;
}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:12px;color:var(--text-3)}
.seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  transition:transform .16s,box-shadow .16s,border-color .16s;position:relative;
}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,32,48,.10);border-color:#d9dee6}
.card.is-read{opacity:.62}
.card__img{width:100%;aspect-ratio:2.1/1;object-fit:cover;background:var(--surface-2);display:block}
.card__body{padding:14px 15px 12px;display:flex;flex-direction:column;flex:1;gap:8px}
.card__meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-3)}
.badge{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:600;white-space:nowrap}
.card__title{font-size:15px;line-height:1.5;font-weight:600;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card__title a:hover{color:var(--brand)}
.card__desc{font-size:12.5px;color:var(--text-2);line-height:1.6;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.tag{font-size:10.5px;color:var(--text-3);background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:4px}
.card__foot{display:flex;align-items:center;gap:10px;padding:9px 15px;border-top:1px solid var(--line);font-size:11px;color:var(--text-3)}
.card__foot .date{font-variant-numeric:tabular-nums}
.card__foot .views{margin-left:auto}
.acts{display:flex;gap:5px;margin-left:8px}
.act{
  width:26px;height:24px;border:1px solid var(--line);background:var(--surface);border-radius:6px;
  font-size:13px;line-height:1;color:var(--text-3);display:flex;align-items:center;justify-content:center;padding:0;
}
.act:hover{border-color:var(--brand);color:var(--brand)}
.act.on{color:var(--brand);background:var(--brand-soft);border-color:var(--brand)}
.vip{font-size:10px;color:#b45309;background:#fff5e6;border:1px solid #f5d9b0;padding:1px 5px;border-radius:4px}

/* list view */
.grid.list{grid-template-columns:1fr}
.grid.list .card{flex-direction:row;align-items:stretch}
.grid.list .card__img{width:150px;aspect-ratio:auto;height:auto;object-fit:cover;flex-shrink:0}
.grid.list .card__body{padding:12px 16px}
.grid.list .card__title{-webkit-line-clamp:1}
.grid.list .card__desc{-webkit-line-clamp:1}
.grid.list .card__foot{border-top:0;border-left:1px solid var(--line);padding:0 14px;flex-direction:column;justify-content:center;gap:6px;min-width:118px}
.grid.list .card__foot .views{margin-left:0}

.more{display:flex;justify-content:center;margin-top:24px}
.more button{padding:11px 34px;border:1px solid var(--line);border-radius:24px;background:var(--surface);color:var(--text-2);font-size:13px}
.more button:hover{border-color:var(--brand);color:var(--brand)}
.empty{text-align:center;padding:70px 20px;color:var(--text-3);font-size:14px}
.empty b{display:block;color:var(--text-2);font-size:16px;margin-bottom:8px}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,34,.48);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex}
.modal{background:var(--surface);border-radius:16px;width:min(560px,100%);padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.2);max-height:86vh;overflow:auto}
.modal h2{margin:0 0 6px;font-size:18px}
.modal p{color:var(--text-2);font-size:12.5px;line-height:1.8;margin:0 0 16px}
.modal textarea{width:100%;height:150px;border:1px solid var(--line);border-radius:9px;padding:11px;background:var(--surface-2);outline:none;resize:vertical;font-size:12.5px;line-height:1.7}
.modal textarea:focus{border-color:var(--brand)}
.modal__row{display:flex;gap:10px;align-items:center;margin:14px 0 18px;flex-wrap:wrap}
.modal__foot{display:flex;justify-content:flex-end;gap:9px}
.footer{text-align:center;color:var(--text-3);font-size:11.5px;padding:26px 10px 0;line-height:1.9}

@media(max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:920px){
  .wrap{grid-template-columns:1fr;padding:18px 16px 50px;gap:16px}
  .side{position:static;max-height:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .panel{margin:0}
  .topbar__in{padding:12px 16px;gap:12px}
  .topbar__stats{display:none}
  .brand{min-width:0}
}
@media(max-width:620px){
  .grid,.grid.list{grid-template-columns:1fr}
  .grid.list .card__img{width:100px}
  .search{order:3;max-width:none;flex-basis:100%}
  .hero{padding:18px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar__in">
    <div class="brand">
      <div class="brand__mark">J7</div>
      <div>
        <div class="brand__t">简七读财 · 文章索引</div>
        <div class="brand__s">JANE7 ARTICLE LIBRARY</div>
      </div>
    </div>
    <div class="search">
      <span class="search__ic">⌕</span>
      <input id="q" type="search" placeholder="搜索标题、简介、标签…" autocomplete="off">
      <span class="search__kbd">/</span>
    </div>
    <div class="topbar__stats">
      <div><b id="statTotal">0</b> 篇</div>
      <div><b id="statCats">0</b> 个主题</div>
      <div id="statRange"></div>
    </div>
    <button class="iconbtn" id="btnRandom" title="随机抽一篇重读">↝ 随机一篇</button>
    <button class="iconbtn" id="btnTheme" title="切换明暗">☾ 夜间</button>
    <a class="iconbtn" href="https://imazy.com.cn/" title="返回博客首页">← 博客</a>
  </div>
</div>

<div class="wrap">
  <aside class="side">
    <div class="panel">
      <div class="panel__h">主题分类</div>
      <div class="catlist" id="catList"></div>
    </div>
    <div class="panel">
      <div class="panel__h">年份</div>
      <div class="years" id="yearChips"></div>
    </div>
    <div class="panel">
      <div class="panel__h">我的阅读</div>
      <div class="quick" id="quickList">
        <button data-q="all" class="on">全部文章</button>
        <button data-q="fav">★ 我的收藏 <span id="cntFav" style="float:right;color:var(--text-3)"></span></button>
        <button data-q="unread">○ 还没读 <span id="cntUnread" style="float:right;color:var(--text-3)"></span></button>
        <button data-q="read">✓ 已读</button>
        <button data-q="vip">◆ 会员专享</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel__h">关于这份索引</div>
      <div class="note" id="aboutNote"></div>
      <button class="iconbtn" id="btnAdd" style="width:100%;margin-top:12px">＋ 补充文章</button>
    </div>
  </aside>

  <main>
    <section class="hero">
      <div class="hero__top">
        <div>
          <div class="hero__badge">按主题重新整理</div>
          <h1 id="heroTitle">全部文章</h1>
          <p>把简七读财官网公开的文章按主题归类，方便按兴趣重读。点开任意一篇即可直达官网全文；收藏和已读记录保存在这台设备的浏览器里。</p>
        </div>
      </div>
      <div class="chart" id="chart"></div>
    </section>

    <div class="toolbar">
      <div class="toolbar__t" id="resultTitle">全部文章 <span id="resultCount"></span></div>
      <select id="sort">
        <option value="new">最新优先</option>
        <option value="old">最早优先</option>
        <option value="hot">阅读最多</option>
        <option value="random">随机排序</option>
      </select>
      <div class="seg" id="viewSeg">
        <button data-v="grid" class="on">▦ 卡片</button>
        <button data-v="list" >☰ 列表</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="more" id="moreBox" style="display:none"><button id="btnMore">加载更多</button></div>
    <div class="footer" id="footer"></div>
  </main>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h2>补充文章</h2>
    <p>官网只同步了公众号的一部分文章。如果发现有想收进索引的（比如公众号里的老文章、其他平台转载），把「标题 | 链接」逐行粘贴进来即可。只填链接也可以，标题会留成链接地址。</p>
    <textarea id="addText" placeholder="例如：&#10;一篇想重读的文章 | https://mp.weixin.qq.com/s/xxxx&#10;另一篇 | https://www.jane7.com/detail/xxxx"></textarea>
    <div class="modal__row">
      <span style="font-size:12.5px;color:var(--text-2)">归入主题：</span>
      <select id="addCat"></select>
      <span style="font-size:11.5px;color:var(--text-3)" id="addHint"></span>
    </div>
    <div class="modal__foot">
      <button class="iconbtn" id="btnCancel">取消</button>
      <button class="iconbtn iconbtn--primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

const CATS = DATA.cats;
const CATMAP = Object.fromEntries(CATS.map(c => [c.id, c]));
let BASE = DATA.articles;
const KEY = 'jane7_reader_v1';
const PAGE = 24;
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { store = {}; }
store.fav = store.fav || {}; store.read = store.read || {}; store.custom = store.custom || [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };

let S = { cat:'all', year:'all', quick:'all', q:'', sort:'new', view:'grid', page:1 };
let shuffle = null;
const all = () => BASE.concat(store.custom);
const byId = () => Object.fromEntries(all().map(a => [a.id, a]));
let IDMAP = byId();

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- sidebar ---------- */
function renderSide(){
  const counts = {};
  BASE.forEach(a => counts[a.c] = (counts[a.c]||0)+1);
  store.custom.forEach(a => counts[a.c] = (counts[a.c]||0)+1);
  let html = `<div class="cat ${S.cat==='all'?'on':''}" data-c="all">
      <span class="cat__ic">▤</span><span class="cat__dot" style="background:var(--brand)"></span>
      <span>全部文章</span><span class="cat__n">${BASE.length + store.custom.length}</span></div>`;
  CATS.forEach(c => {
    const n = counts[c.id] || 0;
    html += `<div class="cat ${S.cat===c.id?'on':''}" data-c="${c.id}" title="${esc(c.name)}">
      <span class="cat__ic">${c.icon}</span><span class="cat__dot" style="background:${c.color}"></span>
      <span>${esc(c.name)}</span><span class="cat__n">${n}</span></div>`;
  });
  document.getElementById('catList').innerHTML = html;

  const years = {};
  BASE.forEach(a => { if(a.y) years[a.y] = (years[a.y]||0)+1; });
  const ys = Object.keys(years).sort();
  document.getElementById('yearChips').innerHTML =
    `<button class="chip ${S.year==='all'?'on':''}" data-y="all">全部</button>` +
    ys.map(y => `<button class="chip ${S.year===y?'on':''}" data-y="${y}">${y}</button>`).join('');
  document.getElementById('chart').innerHTML = ys.map(y => {
    const max = Math.max(...Object.values(years));
    const h = Math.max(5, Math.round(years[y]/max*54));
    return `<div class="bar ${S.year===y?'on':''}" data-y="${y}" title="${y} 年 ${years[y]} 篇">
      <div class="bar__col" style="height:${h}px"></div><div class="bar__lb">${y.slice(2)}</div></div>`;
  }).join('');

  document.getElementById('cntFav').textContent = Object.keys(store.fav).length || '';
  const unread = all().filter(a => !store.read[a.id]).length;
  document.getElementById('cntUnread').textContent = unread;

  const m = DATA.meta;
  document.getElementById('aboutNote').innerHTML =
    `收录 <b>${m.total}</b> 篇官网公开文章，时间跨度 <b>${m.first}</b> 至 <b>${m.last}</b>。<br>
     公众号主页显示 2140 篇原创，官网仅同步其中一部分，更早的文章不在本索引内。<br>
     分类依据标题与摘要自动归类，可自行补充；数据更新于 ${esc(m.updated)}。`;
  document.getElementById('footer').innerHTML =
    `数据来源：${esc(m.source)} · 共 ${m.total} 篇 · 更新于 ${esc(m.updated)}<br>
     阅读时点开卡片即可跳转官网全文；收藏 / 已读仅保存在本机浏览器。重新抓取数据可运行 build.py。`;
  document.getElementById('statTotal').textContent = BASE.length + store.custom.length;
  document.getElementById('statCats').textContent = CATS.length;
  document.getElementById('statRange').textContent = m.first.slice(0,4) + '–' + m.last.slice(0,4);
  document.getElementById('addCat').innerHTML = CATS.map(c =>
    `<option value="${c.id}" ${c.id === 'misc' ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
}

/* ---------- filter ---------- */
function filtered(){
  const q = S.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  let arr = all().filter(a => {
    if (S.cat !== 'all' && a.c !== S.cat) return false;
    if (S.year !== 'all' && a.y !== S.year) return false;
    if (S.quick === 'fav' && !store.fav[a.id]) return false;
    if (S.quick === 'read' && !store.read[a.id]) return false;
    if (S.quick === 'unread' && store.read[a.id]) return false;
    if (S.quick === 'vip' && !a.vip) return false;
    if (terms.length){
      const hay = (a.t + ' ' + a.d + ' ' + (a.tags||[]).join(' ') + ' ' + (CATMAP[a.c]?.name||'')).toLowerCase();
      if (!terms.every(t => hay.includes(t))) return false;
    }
    return true;
  });
  if (S.sort === 'new') arr.sort((x,y) => y.date.localeCompare(x.date) || y.v - x.v);
  else if (S.sort === 'old') arr.sort((x,y) => x.date.localeCompare(y.date));
  else if (S.sort === 'hot') arr.sort((x,y) => y.v - x.v || y.date.localeCompare(x.date));
  else {
    if (!shuffle) shuffle = arr.map(a => a.id).sort(() => Math.random() - .5);
    const rank = Object.fromEntries(shuffle.map((id,i) => [id,i]));
    arr.sort((x,y) => (rank[x.id] ?? 1e9) - (rank[y.id] ?? 1e9));
  }
  return arr;
}

/* ---------- cards ---------- */
function cardHTML(a){
  const c = CATMAP[a.c] || CATMAP.misc;
  const fav = !!store.fav[a.id], read = !!store.read[a.id];
  const tags = (a.tags||[]).slice(0,3).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const img = a.img ? `<img class="card__img" src="${esc(a.img)}" loading="lazy" alt="" onerror="this.style.display='none'">` : '';
  return `<article class="card ${read?'is-read':''}" data-id="${esc(a.id)}">
    ${img}
    <div class="card__body">
      <div class="card__meta">
        <span class="badge" style="color:${c.color};background:${c.color}18">${esc(c.name)}</span>
        ${a.vip ? '<span class="vip">会员</span>' : ''}
      </div>
      <h3 class="card__title"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.t)}</a></h3>
      ${a.d ? `<p class="card__desc">${esc(a.d)}</p>` : ''}
      ${tags ? `<div class="tags">${tags}</div>` : ''}
    </div>
    <div class="card__foot">
      <span class="date">${esc(a.date || '自定义')}</span>
      ${a.v ? `<span class="views">◉ ${a.v >= 10000 ? (a.v/10000).toFixed(1)+'万' : a.v}</span>` : '<span class="views"></span>'}
      <span class="acts">
        <button class="act ${fav?'on':''}" data-act="fav" title="收藏">${fav?'★':'☆'}</button>
        <button class="act ${read?'on':''}" data-act="read" title="标记已读">${read?'✓':'○'}</button>
        ${a.custom ? '<button class="act" data-act="del" title="移除">✕</button>' : ''}
      </span>
    </div>
  </article>`;
}

function render(reset){
  if (reset){ S.page = 1; if (S.sort === 'random') shuffle = null; }
  const arr = filtered();
  const shown = arr.slice(0, S.page * PAGE);
  const grid = document.getElementById('grid');
  grid.className = 'grid' + (S.view === 'list' ? ' list' : '');
  grid.innerHTML = shown.length ? shown.map(cardHTML).join('') :
    `<div class="empty" style="grid-column:1/-1"><b>没有找到匹配的文章</b>换个关键词，或清空筛选条件试试</div>`;
  const label = S.cat === 'all' ? '全部文章' : (CATMAP[S.cat]?.name || '全部文章');
  const qLabel = S.q ? ` · 搜索「${S.q}」` : '';
  const yLabel = S.year === 'all' ? '' : ` · ${S.year} 年`;
  const countText = `共 ${arr.length} 篇${shown.length < arr.length ? ' · 已显示 ' + shown.length + ' 篇' : ''}`;
  document.getElementById('resultTitle').innerHTML = esc(label + yLabel + qLabel) + ` <span>${esc(countText)}</span>`;
  document.getElementById('heroTitle').textContent = label + yLabel;
  document.getElementById('moreBox').style.display = shown.length < arr.length ? 'flex' : 'none';
  document.getElementById('btnMore').textContent = `加载更多（还有 ${arr.length - shown.length} 篇）`;
  renderSide();
}

/* ---------- events ---------- */
document.getElementById('catList').addEventListener('click', e => {
  const el = e.target.closest('.cat'); if (!el) return;
  S.cat = el.dataset.c; render(true);
});
function setYear(y){ S.year = y; render(true); }
document.getElementById('yearChips').addEventListener('click', e => {
  const el = e.target.closest('.chip'); if (el) setYear(el.dataset.y);
});
document.getElementById('chart').addEventListener('click', e => {
  const el = e.target.closest('.bar'); if (el) setYear(S.year === el.dataset.y ? 'all' : el.dataset.y);
});
document.getElementById('quickList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.quick = b.dataset.q;
  document.querySelectorAll('#quickList button').forEach(x => x.classList.toggle('on', x === b));
  render(true);
});
document.getElementById('viewSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.view = b.dataset.v;
  document.querySelectorAll('#viewSeg button').forEach(x => x.classList.toggle('on', x === b));
  render(false);
});
document.getElementById('sort').addEventListener('change', e => {
  S.sort = e.target.value; if (S.sort === 'random') shuffle = null; render(true);
});
let timer;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(timer); timer = setTimeout(() => { S.q = e.target.value; render(true); }, 160);
});
document.getElementById('btnMore').addEventListener('click', () => { S.page++; render(false); });
document.getElementById('grid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const id = card.dataset.id, a = IDMAP[id]; if (!a) return;
  const act = e.target.closest('.act');
  if (act){
    const k = act.dataset.act;
    if (k === 'fav'){ store.fav[id] ? delete store.fav[id] : store.fav[id] = 1; }
    if (k === 'read'){ store.read[id] ? delete store.read[id] : store.read[id] = 1; }
    if (k === 'del'){
      store.custom = store.custom.filter(x => x.id !== id);
      delete store.fav[id]; delete store.read[id]; IDMAP = byId();
    }
    save(); render(false); return;
  }
  if (e.target.closest('a')) return;
  window.open(a.url, '_blank', 'noopener');
});
document.getElementById('btnRandom').addEventListener('click', () => {
  const pool = filtered();
  if (!pool.length){ alert('当前筛选下没有文章'); return; }
  const a = pool[Math.floor(Math.random() * pool.length)];
  window.open(a.url, '_blank', 'noopener');
});
document.getElementById('btnTheme').addEventListener('click', e => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  e.target.textContent = dark ? '☾ 夜间' : '☀ 日间';
  localStorage.setItem('jane7_theme', dark ? 'light' : 'dark');
});
if (localStorage.getItem('jane7_theme') === 'dark'){
  document.documentElement.setAttribute('data-theme','dark');
  document.getElementById('btnTheme').textContent = '☀ 日间';
}
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA'){
    e.preventDefault(); document.getElementById('q').focus();
  }
  if (e.key === 'Escape'){
    if (document.getElementById('mask').classList.contains('on')) closeModal();
    else { const q = document.getElementById('q'); q.value = ''; S.q = ''; q.blur(); render(true); }
  }
});

/* ---------- add custom ---------- */
const mask = document.getElementById('mask');
const closeModal = () => mask.classList.remove('on');
document.getElementById('btnAdd').addEventListener('click', () => {
  document.getElementById('addHint').textContent = `已补充 ${store.custom.length} 篇`;
  mask.classList.add('on');
});
document.getElementById('btnCancel').addEventListener('click', closeModal);
mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });
document.getElementById('btnSave').addEventListener('click', () => {
  const lines = document.getElementById('addText').value.split('\n').map(s => s.trim()).filter(Boolean);
  const cat = document.getElementById('addCat').value;
  const today = new Date().toISOString().slice(0,10);
  let n = 0;
  lines.forEach(line => {
    let title = '', url = '';
    const parts = line.split(/\s*[|｜]\s*/);
    if (parts.length >= 2){ title = parts[0]; url = parts.slice(1).join(' '); }
    else {
      const m = line.match(/https?:\/\/\S+/);
      if (m){ url = m[0]; title = line.replace(m[0],'').trim() || url; }
      else { title = line; url = ''; }
    }
    url = url.trim();
    if (!url.startsWith('http')) return;
    const id = 'custom-' + Math.random().toString(36).slice(2,10);
    store.custom.unshift({ id, t:title, d:'', date:today, y:today.slice(0,4), v:0, c:cat,
      tags:['自定义'], vip:0, img:'', url, custom:1 });
    n++;
  });
  save(); IDMAP = byId();
  document.getElementById('addText').value = '';
  closeModal();
  if (n){
    S.cat = 'all'; S.quick = 'all';
    document.querySelectorAll('#quickList button').forEach(x => x.classList.toggle('on', x.dataset.q === 'all'));
    render(true);
  } else render(false);
});

async function boot(){
  try {
    const res = await fetch('./articles.json', { cache: 'no-store' });
    if (res.ok){
      const j = await res.json();
      if (j && Array.isArray(j.articles) && j.articles.length){
        DATA = { meta: Object.assign({}, DATA.meta, j.meta || {}),
                 cats: DATA.cats, articles: j.articles };
        BASE = DATA.articles;
        IDMAP = byId();
      }
    }
  } catch (e) { /* 本地 file:// 或跨域时静默回退到内嵌数据 */ }
  render(true);
}
boot();
</script>
</body>
</html>
